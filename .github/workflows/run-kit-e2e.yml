name: Run kit
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-kit:
    runs-on: ubuntu-24.04 # pinned: Playwright does not support the newer ubuntu-latest image yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: The neutral build and the app-only build, served by serve.mjs and nothing else (docs/RUN-IT.md)
        run: node tests/e2e/run-kit.e2e.mjs
