name: Site links
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-links:
    runs-on: ubuntu-24.04 # pinned: Playwright does not support the newer ubuntu-latest image yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Every surface that links to our pages, with our manifest, with none and with a page missing (docs/SITE-LINKS.md)
        run: node tests/e2e/site-links.e2e.mjs
