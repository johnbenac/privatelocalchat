name: Deploy Cloudflare Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The site layer (the pages, manifests and announcements of the site, docs/SITE-LAYER.md) is a private repository on the same branch name. A read-only deploy key fetches it. If it cannot
      # be fetched this job fails, which leaves the live site as it is: production never carries the neutral pages by accident.
      - name: Fetch the site layer
        uses: actions/checkout@v4
        with:
          repository: johnbenac/privatelocalchat-site
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site-layer
          persist-credentials: false
      - name: Validate
        run: |
          npm test
          python3 -m unittest discover -s dev-tools/tests -v
          # the tests that pin this site's own wording, from the site layer
          APP_ROOT="$PWD" SITE_ROOT="$PWD/site-layer" node --test site-layer/tests/*.test.mjs
      - name: Build exact commit
        run: npm run build
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          SITE_DIR: site-layer
      - name: Check branch has not advanced
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            project=privatelocalchat
            url=https://privatelocal.chat
          else
            project=privatelocalchat-dev
            url=https://dev.privatelocal.chat
          fi
          # a deploy replaces the whole site: keep the earlier builds' folders so tabs that started on them keep working (docs/UPGRADE-BEHAVIOUR.md)
          node scripts/retain-releases.mjs --site "https://$project.pages.dev"
          npx wrangler pages deploy dist --project-name "$project" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
          DEPLOY_SITE_URL="https://$project.pages.dev" node scripts/verify-release.mjs
          echo "### Deployed [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      # No artifact of the built site is kept: it holds the site layer, which is not published as files, only served (docs/SITE-LAYER.md).
